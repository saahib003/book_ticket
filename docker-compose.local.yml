services:
  postgres:
    image: postgres:18
    container_name: ticket-booking-postgres
    environment:
      POSTGRES_USER: ticket_app
      POSTGRES_PASSWORD: ticket_app_local
      POSTGRES_DB: ticket_booking
    ports:
      - "5433:5432"
    volumes:
      - ticket_booking_postgres_data:/var/lib/postgresql
      - ./infra/local/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_app -d ticket_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticket-booking-redis
    ports:
      - "6379:6379"
    volumes:
      - ticket_booking_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticket_booking_postgres_data:
  ticket_booking_redis_data:

