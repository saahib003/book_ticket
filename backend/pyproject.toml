[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-booking-backend"
version = "0.1.0"
description = "Learning-focused ticket booking system backend"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-SQLAlchemy>=3.1,<4",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "redis>=5,<7",
  "argon2-cffi>=23,<26",
  "PyJWT>=2.9,<3",
  "email-validator>=2.2,<3",
  "Flask-Cors>=5,<7",
  "celery>=5.4,<6",
  "Flask-SocketIO>=5.5,<6",
  "prometheus-client>=0.21,<1",
  "razorpay>=1.4,<2",
  # Razorpay 1.4.2 still imports pkg_resources at runtime.
  "setuptools<81",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
load = ["locust>=2.32,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
